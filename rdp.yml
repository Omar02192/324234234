
name: Windows Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Check Windows
        shell: pwsh
        run: |
          Write-Host "Windows environment is ready"
          Get-ComputerInfo |
            Select-Object OsName, OsVersion
          $PSVersionTable.PSVersion

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Verify Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (!(Test-Path $ts)) {
            throw "Tailscale not installed"
          }

          $status = & $ts status --json |
            ConvertFrom-Json

          if ($status.BackendState -ne "Running") {
            throw "Tailscale is not connected"
          }

          Write-Host "Tailscale connected successfully"

      - name: Test Complete
        shell: pwsh
        run: |
          Write-Host "Windows test completed"
